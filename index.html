<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лапа помощи — панель волонтёра приюта</title>
  <meta name="description" content="Панель волонтёра приюта: задачи смены, погода для выгула и питомцы, которые ищут дом.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <span class="header__logo" aria-hidden="true">🐾</span>
      <div>
        <h1 class="header__title">Лапа помощи</h1>
        <p class="header__subtitle">Панель волонтёра приюта</p>
      </div>
    </div>

    <nav class="toolbar" aria-label="Добавить виджет">
      <button class="toolbar__btn" type="button" data-add="todo">
        <span aria-hidden="true">📋</span> Задачи смены
      </button>
      <button class="toolbar__btn" type="button" data-add="weather">
        <span aria-hidden="true">🌤️</span> Погода для выгула
      </button>
      <button class="toolbar__btn" type="button" data-add="dog">
        <span aria-hidden="true">🐶</span> Ищет дом
      </button>
    </nav>
  </header>

  <main class="main">
    <!-- Подсказка, если модули не запустились (например, файл открыт двойным кликом) -->
    <div id="start-error" class="start-error" role="alert" hidden>
      <p class="start-error__title">⚠️ Панель не запустилась</p>
      <p id="start-error-text"></p>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <p class="empty__icon" aria-hidden="true">🦴</p>
      <p class="empty__title">Панель пуста</p>
      <p class="empty__text">Добавьте виджеты кнопками вверху.</p>
    </div>
  </main>

  <footer class="footer">
    Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
    <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener">Dog CEO API</a>.
    Фото собак демонстрационные, не из реального приюта.
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
  <script>
    setTimeout(function () {
      if (window.lapaStarted) return;
      var box = document.getElementById('start-error');
      var text = document.getElementById('start-error-text');
      if (location.protocol === 'file:') {
        text.textContent = 'Страница открыта как файл (адрес начинается с file://). ' +
          'Браузер не запускает JS-модули в таком режиме. Откройте её через сервер: ' +
          'VS Code → Live Server, или в папке проекта выполните «python -m http.server 8000» ' +
          'и откройте http://localhost:8000';
      } else {
        text.textContent = 'Скрипт не загрузился. Нажмите F12 → вкладка Console и пришлите текст красной ошибки. ' +
          'Проверьте, что папки css и js лежат рядом с index.html и названия файлов не изменены.';
      }
      box.hidden = false;
    }, 1500);
  </script>
</body>
</html>
